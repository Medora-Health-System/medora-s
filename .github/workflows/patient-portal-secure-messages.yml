name: Patient Portal Secure Messaging

on:
  pull_request:
    paths:
      - "apps/api/src/patient-portal/messages/**"
      - "apps/api/src/patient-portal/patient-portal.module.ts"
      - "apps/api/prisma/migrations/*patient_portal_secure_messages/**"
      - ".github/workflows/patient-portal-secure-messages.yml"

jobs:
  secure-messaging-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @medora/shared build

      - name: Prisma generate
        run: pnpm --filter @medora/api exec prisma generate

      - name: Secure messaging security tests
        working-directory: apps/api
        run: pnpm exec jest --config jest.config.cjs patient-messages.service.spec.ts --runInBand
