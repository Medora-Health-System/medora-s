name: Patient Portal Staff Requests

on:
  pull_request:
    paths:
      - "apps/api/src/patient-portal/requests/**"
      - "apps/web/app/app/admin/patient-portal/**"
      - "apps/web/src/lib/patientPortalRequestsApi.ts"
      - ".github/workflows/patient-portal-staff-requests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patient-portal-staff-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @medora/shared build
      - name: Prisma generate
        run: pnpm --filter @medora/api exec prisma generate
      - name: Request workflow tests
        working-directory: apps/api
        run: pnpm exec jest --config jest.config.cjs patient-service-requests.service.spec.ts --runInBand
      - name: Web typecheck
        run: pnpm --filter @medora/web exec tsc --noEmit
